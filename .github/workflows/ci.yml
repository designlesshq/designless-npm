name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build wasm + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Builds EVERY ABI target and fails if any artifact is missing. Building
      # only the default one is how a package shipped that could not load on
      # Next 15 at all: nothing here ever compiled the other pin.
      - name: Build the SWC plugin (wasm, all ABI targets)
        working-directory: annotate
        run: node scripts/build-swc.mjs

      - name: Native Rust unit tests
        working-directory: annotate/swc-plugin
        run: cargo test --release

      - name: '@designless/annotate — JS tests (Babel + SWC wasm via @swc/core)'
        working-directory: annotate
        run: |
          npm install --no-audit --no-fund
          npx vitest run

      - name: 'create-designless — JS tests'
        working-directory: create-designless
        run: |
          npm install --no-audit --no-fund
          npx vitest run

      - name: '@designless/extract — JS tests'
        working-directory: extract
        run: |
          npm install --no-audit --no-fund
          npx vitest run

      - name: '@designless/dev-auth — JS tests (fail-closed receiver)'
        working-directory: dev-auth
        run: |
          npm install --no-audit --no-fund
          npx vitest run

      - name: '@designless/web — build + JS tests (loader, publish manifest)'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm test

      # Typecheck first and separately: a type error and a failing test read
      # the same in a combined log, and only one of them is a behaviour change.
      - name: '@designless/react-native: typecheck'
        working-directory: react-native
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      # `npm test` builds the bundle first and every test runs against the
      # built dist rather than against src, so this covers the shipped file
      # set as well as the behaviour.
      - name: '@designless/react-native: build + JS tests'
        working-directory: react-native
        run: npm test

      # No package to install: it is a plain node script over a JSON file, and
      # it guards a file that reaches users via the CDN rather than via npm, so
      # nothing else in this workflow would catch a bad edit to it.
      - name: 'cdn/serve — capabilities manifest is well formed'
        run: node cdn/validate-serve-manifest.mjs

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: annotate-wasm
          path: |
            annotate/swc-plugin/annotate.wasm
            annotate/swc-plugin-core35/annotate.wasm

  next-turbopack:
    name: 'real Next (${{ matrix.next }}) under Turbopack'
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `latest` and `canary` are both Next 16, which is why a package that
        # 500'd every route on Next 15.5 shipped with this workflow green. The
        # supported floor needs its own leg or it is not tested at all.
        #
        # `ts` is pinned per entry because the toolchains diverge: Next 16
        # rejects TypeScript 7 and asks for 6, while Next 15 predates 6.
        # An unpinned tag makes a TS break look like a plugin ABI failure.
        include:
          - next: latest
            ts: '6'
          - next: canary
            ts: '6'
          - next: '15'
            ts: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: annotate-wasm
          path: annotate

      - name: Pack @designless/annotate (the real published file set)
        id: pack
        working-directory: annotate
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Scaffold a minimal Next app and wire the plugin
        run: |
          mkdir -p app
          cat > package.json <<'JSON'
          { "name": "ci-next", "private": true, "version": "0.0.0" }
          JSON
          cat > app/layout.tsx <<'TSX'
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (<html lang="en"><body>{children}</body></html>);
          }
          TSX
          cat > app/page.tsx <<'TSX'
          export default function Home() {
            return (<main><h1 className="t">Hello Designless</h1></main>);
          }
          TSX
          cat > next.config.js <<'JS'
          const { withDesignless } = require('@designless/annotate/next')
          module.exports = withDesignless({ reactStrictMode: true })
          JS
          # The scaffold uses .tsx files, so Next requires the TS toolchain present or
          # `next dev` aborts its TS check before any markers stamp. PIN typescript@6:
          # the unpinned `typescript` tag now resolves to 7.x (the native compiler),
          # whose compiler API Next 16.2/16.3 rejects ("install TypeScript 6 instead"),
          # aborting the boot — which the marker check below would MISreport as an ABI
          # issue. The annotate wasm (swc_core 68) is fine; only the TS toolchain drifted.
          npm install --no-audit --no-fund next@${{ matrix.next }} react react-dom typescript@${{ matrix.ts }} @types/react @types/node "./annotate/${{ steps.pack.outputs.tarball }}"

      - name: 'next dev under Turbopack stamps annotate/v1 markers'
        run: |
          npx next dev -p 3939 > next-dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:3939/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          HTML=$(curl -s --max-time 6 http://localhost:3939/ || true)
          kill $DEV_PID 2>/dev/null || true
          echo "$HTML" | grep -oE 'data-source-file="[^"]*"|data-designless="[^"]*"' | sort -u || true
          if echo "$HTML" | grep -q 'data-designless="annotate/v1"'; then
            echo "PASS: markers stamped under Next ${{ matrix.next }}"
          else
            # Disambiguate the two failure classes so a toolchain break is never again
            # MISreported as a plugin ABI issue (that mislabel once cost a full misdiagnosis).
            if grep -qiE "compiler API|does not provide|Unhandled Rejection|Cannot find module" next-dev.log; then
              echo "FAIL: Next ${{ matrix.next }} failed to boot (toolchain/deps) — NOT a plugin ABI issue. Fix the toolchain. Log:"
            else
              echo "FAIL: Next ${{ matrix.next }} booted but stamped no annotate/v1 markers — likely a real SWC plugin/ABI issue. Log:"
            fi
            tail -40 next-dev.log
            exit 1
          fi
